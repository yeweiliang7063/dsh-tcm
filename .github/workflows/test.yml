# 三系统测试机：每次推送、每次提 PR 自动在 Windows / macOS / Linux 上各跑一遍
# 三件事：单元测试、配置自检、真装一遍（装进临时 profile，不碰真实 ~/.dsh）
name: 三系统测试

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 单元测试
        run: npm test

      - name: 配置自检
        run: node verify-preset.mjs

      # 真装一遍：造一个空的 DSH profile，把插件装进去，再核对登记项与链接。
      # 走的是和用户双击后敲 node install.mjs 完全相同的代码路径。
      - name: 真装一遍（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'fake-profile'
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          '{"name":"fake-profile","private":true}' | Set-Content -Path (Join-Path $profile 'package.json') -Encoding utf8
          node install.mjs --profile $profile
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 真装一遍（macOS / Linux）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          profile="$RUNNER_TEMP/fake-profile"
          mkdir -p "$profile"
          echo '{"name":"fake-profile","private":true}' > "$profile/package.json"
          node install.mjs --profile "$profile"
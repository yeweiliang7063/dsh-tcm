# 三系统测试机：每次推送、每次提 PR 自动在 Windows / macOS / Linux 上各跑一遍
# 三件事，按顺序：单元测试 → 真装一遍 → 配置自检（自检要看安装结果，必须排在装之后）
name: 三系统测试

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 测试会加载 lib/index.js，需要运行时依赖（@deepseek-ai/schemastery、yaml）。
      # 缺了这三步，三个平台都会在断言之前就 ERR_MODULE_NOT_FOUND 全红。
      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 单元测试
        run: npm test

      # 真装一遍：造一个空的 DSH profile，把插件装进去。
      # 走的是和用户解压后敲 node install.mjs 完全相同的代码路径（含装完自带的那遍自检）。
      - name: 真装一遍（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'fake-profile'
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          '{"name":"fake-profile","private":true}' | Set-Content -Path (Join-Path $profile 'package.json') -Encoding utf8
          node install.mjs --profile $profile
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 真装一遍（macOS / Linux）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          profile="$RUNNER_TEMP/fake-profile"
          mkdir -p "$profile"
          echo '{"name":"fake-profile","private":true}' > "$profile/package.json"
          node install.mjs --profile "$profile"

      # 自检要检查「装好了没、登记对不对」，必须放在真装之后；
      # 指定 TCM_PROFILE 指向刚装的那个临时 profile，不去猜用户本机的。
      - name: 配置自检（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TCM_PROFILE: ${{ runner.temp }}\fake-profile
        run: node verify-preset.mjs

      - name: 配置自检（macOS / Linux）
        if: runner.os != 'Windows'
        shell: bash
        env:
          TCM_PROFILE: ${{ runner.temp }}/fake-profile
        run: node verify-preset.mjs